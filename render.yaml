services:
  - type: web
    name: aravind-anupama-invitation
    runtime: static
    branch: main
    staticPublishPath: .
    headers:
      # Fonts and images never change once published — cache them hard.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The page itself gets edited on the day (stream ID), so never cache it.
      - path: /index.html
        name: Cache-Control
        value: no-cache
